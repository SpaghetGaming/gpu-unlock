# gpu-unlock: shipped in the rootfs so the module exists before nvidia binds.
# softdep makes kmod load gpu_unlock first, while the cards are still unbound;
# options sets the default targets. Unraid has no initramfs, so this file has to
# be inside bzroot's rootfs rather than written later by the plugin.
#
# No "blacklist nvidia" here: nvidia.ko is absent from the rootfs at coldplug
# time, so there are no aliases to blacklist, and the driver is loaded by an
# explicit `modprobe nvidia` from the Nvidia Driver plugin regardless.
softdep nvidia pre: gpu_unlock
options gpu_unlock targets=@TARGETS@
